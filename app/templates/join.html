{% extends "base.html" %}
{% block title %}Join Game — Fire or Cheeks{% endblock %}
{% block body %}
<div class="page-center">
  <div class="card">
    <div class="card-header">
      <a href="{{ request.url_for('home') }}" class="back-link">← Back</a>
      <h1>🎟 Join a Game</h1>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ request.url_for('join_game') }}" class="form-stack">
      <label class="field-label">Game Code
        <input
          type="text"
          name="code"
          value="{{ code }}"
          placeholder="ABC123"
          maxlength="6"
          autocomplete="off"
          autocapitalize="characters"
          class="input input-code-big"
          required
          autofocus
        />
      </label>

      <label class="field-label">Your Display Name
        <input
          type="text"
          name="display_name"
          placeholder="e.g. CoolBeans"
          maxlength="30"
          class="input"
          required
        />
      </label>

      <button type="submit" class="btn btn-join btn-lg">Let's Go →</button>
    </form>
  </div>
</div>
{% endblock %}
